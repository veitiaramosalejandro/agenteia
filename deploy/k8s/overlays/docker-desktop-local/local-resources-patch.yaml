apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-service
  namespace: agenteia-prod
spec:
  template:
    spec:
      containers:
        - name: agent-service
          resources:
            requests: { cpu: "250m", memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
---
