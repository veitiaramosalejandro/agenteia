apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-chat
  namespace: agenteia-prod
spec:
  template:
    spec:
      runtimeClassName: null
      containers:
        - name: ollama-chat
          resources:
            $patch: replace
            requests: { cpu: "1", memory: 2Gi }
            limits: { cpu: "2", memory: 4Gi }
---
