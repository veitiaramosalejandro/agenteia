apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-control-center
  namespace: agenteia-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-control-center
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-control-center
    spec:
      containers:
        - name: agent-control-center
          image: registry.example.com/agenteia/agent-control-center:0.5.0
          env:
            - name: AGENT_API_UPSTREAM
              value: http://agent-service:8000
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 512Mi
---
