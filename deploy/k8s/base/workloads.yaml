apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-service
  namespace: agenteia-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-service
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: agent-service
          image: registry.example.com/agenteia/agent-service:0.0.2
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: agenteia-runtime
            - secretRef:
                name: agenteia-secrets
          readinessProbe:
            httpGet:
              path: /api/v1/agent/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: agent-data
              mountPath: /app/data
            - name: agent-audio
              mountPath: /app/audio
      volumes:
        - name: agent-data
          persistentVolumeClaim:
            claimName: agent-data
        - name: agent-audio
          persistentVolumeClaim:
            claimName: agent-audio
---
