apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-service
  namespace: agenteia-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-service
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: agent-service
          image: registry.example.com/agenteia/agent-service:0.0.2
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: agenteia-runtime
            - secretRef:
                name: agenteia-secrets
          readinessProbe:
            httpGet:
              path: /api/v1/agent/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-worker
  namespace: agenteia-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-worker
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: agent-worker
          image: registry.example.com/agenteia/agent-service:0.0.2
          command: ["python", "-m", "app.response_worker"]
          envFrom:
            - configMapRef:
                name: agenteia-runtime
            - secretRef:
                name: agenteia-secrets
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 6Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: suggestion-worker
  namespace: agenteia-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: suggestion-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: suggestion-worker
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: suggestion-worker
          image: registry.example.com/agenteia/agent-service:0.0.2
          command: ["python", "-m", "app.suggestion_worker"]
          envFrom:
            - configMapRef:
                name: agenteia-runtime
            - secretRef:
                name: agenteia-secrets
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 6Gi

