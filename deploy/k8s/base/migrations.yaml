apiVersion: batch/v1
kind: Job
metadata:
  name: agenteia-db-migrations
  namespace: agenteia-prod
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agenteia-db-migrations
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrations
          image: registry.example.com/agenteia/db-migrations:0.0.1
          env:
            - name: PGHOST
              value: timescaledb
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              valueFrom:
                configMapKeyRef:
                  name: agenteia-runtime
                  key: POSTGRES_DB
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: agenteia-secrets
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: agenteia-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 512Mi

