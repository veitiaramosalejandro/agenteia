apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agent-service
  namespace: agenteia-prod
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agent-worker
  namespace: agenteia-prod
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-worker

