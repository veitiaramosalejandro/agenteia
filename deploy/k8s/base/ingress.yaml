apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agenteia
  namespace: agenteia-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - agent.example.com
        - control.example.com
      secretName: agenteia-tls
  rules:
    - host: agent.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agent-service
                port:
                  name: http
    - host: control.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agent-control-center
                port:
                  name: http

