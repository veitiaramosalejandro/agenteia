apiVersion: v1
kind: Service
metadata:
  name: timescaledb
  namespace: agenteia-prod
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: timescaledb
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: timescaledb
  namespace: agenteia-prod
spec:
  serviceName: timescaledb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: timescaledb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: timescaledb
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: timescaledb
          image: timescale/timescaledb:latest-pg15
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: agenteia-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agenteia-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: agenteia-runtime
                  key: POSTGRES_DB
          args:
            - postgres
            - -c
            - shared_buffers=4GB
            - -c
            - effective_cache_size=10GB
            - -c
            - work_mem=16MB
            - -c
            - maintenance_work_mem=512MB
            - -c
            - max_connections=200
            - -c
            - max_wal_size=4GB
            - -c
            - checkpoint_completion_target=0.9
            - -c
            - random_page_cost=1.1
            - -c
            - wal_compression=on
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "6"
              memory: 16Gi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cache
  namespace: agenteia-prod
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: redis-cache
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-cache
  namespace: agenteia-prod
spec:
  serviceName: redis-cache
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-cache
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: redis-cache
          image: redis:7-alpine
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --save
            - "60"
            - "1"
            - --maxmemory
            - 6gb
            - --maxmemory-policy
            - allkeys-lru
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "250m"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 8Gi
          volumeMounts:
            - name: redis-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 30Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vector-db
  namespace: agenteia-prod
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: vector-db
  ports:
    - name: http
      port: 6333
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vector-db
  namespace: agenteia-prod
spec:
  serviceName: vector-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vector-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vector-db
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: vector-db
          image: qdrant/qdrant@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad
          ports:
            - name: http
              containerPort: 6333
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 16Gi
          volumeMounts:
            - name: qdrant-data
              mountPath: /qdrant/storage
  volumeClaimTemplates:
    - metadata:
        name: qdrant-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-data
  namespace: agenteia-prod
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-audio
  namespace: agenteia-prod
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Gi

