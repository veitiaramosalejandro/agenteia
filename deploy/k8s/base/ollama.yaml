      labels:
        app.kubernetes.io/name: ollama-system-embeddings
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: ollama-system-embeddings
          image: ollama/ollama:0.33.2
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
            - name: OLLAMA_NUM_PARALLEL
              value: "2"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
            - name: OLLAMA_MAX_QUEUE
              value: "128"
            - name: OLLAMA_CONTEXT_LENGTH
              value: "4096"
            - name: OLLAMA_KEEP_ALIVE
              value: 24h
          ports:
            - name: http
              containerPort: 11434
          readinessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 45
            periodSeconds: 30
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 6Gi
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama
      volumes:
        - name: ollama-models
          persistentVolumeClaim:
            claimName: ollama-system-embeddings-models
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-system-embeddings-models
  namespace: agenteia-prod
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-chat-model-init
  namespace: agenteia-prod
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: model-init
          image: ollama/ollama:0.33.2
          env:
            - name: OLLAMA_HOST
              value: http://ollama-chat:11434
            - name: MODEL_NAME
              valueFrom:
                configMapKeyRef:
                  name: agenteia-runtime
                  key: MODEL_NAME
          command: ["sh", "-c"]
          args:
            - >-
              until ollama list >/dev/null 2>&1; do sleep 5; done;
              ollama pull "$MODEL_NAME"
---
