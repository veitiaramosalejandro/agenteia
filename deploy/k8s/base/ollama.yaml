apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-chat
  namespace: agenteia-prod
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama-chat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama-chat
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: ollama-chat
          image: ollama/ollama:0.33.2
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
            - name: OLLAMA_MAX_QUEUE
              value: "64"
            - name: OLLAMA_CONTEXT_LENGTH
              value: "8192"
            - name: OLLAMA_FLASH_ATTENTION
              value: "1"
            - name: OLLAMA_KV_CACHE_TYPE
              value: q8_0
            - name: OLLAMA_KEEP_ALIVE
              value: 24h
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
          ports:
            - name: http
              containerPort: 11434
          readinessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
            limits:
              cpu: "12"
              memory: 64Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama
      volumes:
        - name: ollama-models
          persistentVolumeClaim:
            claimName: ollama-chat-models
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-chat-models
  namespace: agenteia-prod
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 60Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-embeddings
  namespace: agenteia-prod
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama-embeddings
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama-embeddings
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: ollama-embeddings
          image: ollama/ollama:0.33.2
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
            - name: OLLAMA_NUM_PARALLEL
              value: "2"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
            - name: OLLAMA_MAX_QUEUE
              value: "64"
            - name: OLLAMA_CONTEXT_LENGTH
              value: "4096"
            - name: OLLAMA_KEEP_ALIVE
              value: 24h
          ports:
            - name: http
              containerPort: 11434
          readinessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 45
            periodSeconds: 30
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama
      volumes:
        - name: ollama-models
          persistentVolumeClaim:
            claimName: ollama-embeddings-models
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-embeddings-models
  namespace: agenteia-prod
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
