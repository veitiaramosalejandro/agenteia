apiVersion: v1
kind: ConfigMap
metadata:
  name: solidset-data-api-runtime
  namespace: agenteia-prod
data:
  SQL_SERVER_HOST: replace-with-sql-server-host
  SQL_SERVER_INSTANCE: ""
  SQL_SERVER_PORT: "1433"
  SQL_SERVER_LOGIN_TIMEOUT: "15"
  SQL_SERVER_QUERY_TIMEOUT: "120"
---
apiVersion: v1
kind: Secret
metadata:
  name: solidset-data-api-secrets
  namespace: agenteia-prod
type: Opaque
stringData:
  SQL_SERVER_DATABASE: replace-me
  SQL_SERVER_USERNAME: replace-me
  SQL_SERVER_PASSWORD: replace-me
---
apiVersion: v1
kind: Service
metadata:
  name: solidset-data-api
  namespace: agenteia-prod
spec:
  selector:
    app.kubernetes.io/name: solidset-data-api
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: solidset-data-api
  namespace: agenteia-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: solidset-data-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: solidset-data-api
    spec:
      containers:
        - name: solidset-data-api
          image: registry.example.com/agenteia/solidset-data-api:0.1.0
          envFrom:
            - configMapRef:
                name: solidset-data-api-runtime
            - secretRef:
                name: solidset-data-api-secrets
          env:
            - name: RUNNING_IN_DOCKER
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi

