services:
  # API del agente. n8n accede internamente mediante http://agent-service:8000.
  nginx:
    image: nginx:1.27-alpine
    container_name: machining_nginx
    hostname: nginx
    restart: always
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/conf.d/agent.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/internal:/etc/nginx/internal:ro
    depends_on:
      agent-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - machining-network

  certbot:
    image: certbot/certbot:latest
    container_name: machining_certbot
    profiles: ["certbot"]
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

  agent-service:
    image: agent-beta:0.0.1    
    container_name: machining_agent
    hostname: agent-service
    restart: always
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - ${AGENT_ENV_FILE:-.env}
    environment:
      ENVIRONMENT: production
      RUNNING_IN_DOCKER: "1"
      OLLAMA_BASE_URL: http://ollama-chat:11434
      EMBEDDING_BASE_URL: http://ollama-embeddings:11434
      VECTOR_DB_URL: http://vector-db:6333
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      DB_URL: postgresql://user:pass@timescaledb:5432/machining_db
      REDIS_URL: redis://redis-cache:6379
      DIALOGUE_MAX_CONCURRENT: 1
      # SQL_SERVER_HOST/INSTANCE/PORT proceden de .env.production. No deben
      # interpolarse aquí desde el .env de desarrollo.
      # Las respuestas usan la identidad por recurso almacenada en PostgreSQL.
      # Se neutraliza cualquier cuenta global antigua que permanezca en .env.
      SOLIDSET_LOGIN_USERNAME: ""
      SOLIDSET_LOGIN_PASSWORD: ""
      SOLIDSET_LOGIN_HASHPASS: ""
      SOLIDSET_LOGIN_RESOURCE_ID: ""
      SOLIDSET_RESOURCE_ID: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:      
      - ./data:/app/data
      - ./audio:/app/audio
    depends_on:
      ollama-chat-init:
        condition: service_completed_successfully
      ollama-embeddings-init:
        condition: service_completed_successfully
    #  timescaledb:
    #    condition: service_healthy
    #  redis-cache:
    #    condition: service_healthy
    #  vector-db:
    #    condition: service_healthy
    networks:
      - machining-network      

  # Worker durable. Escala horizontalmente sin cambiar la API:
  # docker compose -f docker-compose-prod.yml up -d --scale agent-worker=4
  agent-worker:
    image: agent-beta:0.0.1
    container_name: machining_agent_worker
    hostname: agent-worker
    restart: always
    command: ["python", "-m", "app.response_worker"]
    env_file:
      - ${AGENT_ENV_FILE:-.env}
    environment:
      ENVIRONMENT: production
      RUNNING_IN_DOCKER: "1"
      OLLAMA_BASE_URL: http://ollama-chat:11434
      EMBEDDING_BASE_URL: http://ollama-embeddings:11434
      VECTOR_DB_URL: http://vector-db:6333
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis-cache:6379
      SOLIDSET_LOGIN_USERNAME: ""
      SOLIDSET_LOGIN_PASSWORD: ""
      SOLIDSET_LOGIN_HASHPASS: ""
      SOLIDSET_LOGIN_RESOURCE_ID: ""
      SOLIDSET_RESOURCE_ID: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./audio:/app/audio
    depends_on:
      ollama-chat-init:
        condition: service_completed_successfully
      ollama-embeddings-init:
        condition: service_completed_successfully
    #  timescaledb:
    #    condition: service_healthy
    #  redis-cache:
    #    condition: service_healthy
    #  vector-db:
    #    condition: service_healthy
    networks:
      - machining-network

  historical-worker:
    image: agent-beta:0.0.1
    restart: always
    command: ["python", "-m", "app.historical.worker"]
    env_file:
      - ${AGENT_ENV_FILE:-.env}
    environment:
      ENVIRONMENT: production
      RUNNING_IN_DOCKER: "1"
      OLLAMA_BASE_URL: http://ollama-chat:11434
      EMBEDDING_BASE_URL: http://ollama-embeddings:11434
      VECTOR_DB_URL: http://vector-db:6333
      POSTGRES_HOST: timescaledb
      REDIS_URL: redis://redis-cache:6379
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["./data:/app/data"]
    depends_on:
      ollama-embeddings-init: {condition: service_completed_successfully}
    #  timescaledb: {condition: service_healthy}
    #  redis-cache: {condition: service_healthy}
    #  vector-db: {condition: service_healthy}
    networks: [machining-network]

  historical-producer:
    extends:
      service: historical-worker
    command: ["python", "-m", "app.historical.producer"]

  # Runtime interactivo. El overlay GPU reserva la GPU únicamente para este
  # servicio; embeddings e ingestión usan el runtime CPU independiente.
  ollama-chat:
    image: ollama/ollama:latest
    container_name: machining_ollama_chat
    hostname: ollama-chat
    restart: always
    user: root  # Añadir esta línea
    ports:
      - 11434:11434
    volumes:
      # Este volumen guarda los modelos descargados localmente:
      - ./ollama_storage:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      # El compose base funciona también sin GPU. Con CPU se limita la
      # concurrencia para no agotar RAM; el overlay GPU puede sobrescribirla.
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_MAX_QUEUE=${OLLAMA_MAX_QUEUE:-32}
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-4096}
      - OLLAMA_FLASH_ATTENTION=0
      - OLLAMA_KV_CACHE_TYPE=f16
      - OLLAMA_KEEP_ALIVE=${OLLAMA_CHAT_KEEP_ALIVE:-24h}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      machining-network:
        aliases:
          - ollama-llm

  ollama-embeddings:
    image: ollama/ollama:latest
    container_name: machining_ollama_embeddings
    hostname: ollama-embeddings
    restart: always
    user: root
    ports:
      - 11435:11434
    volumes:
      - ./ollama_embedding_storage:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_NUM_PARALLEL=${OLLAMA_EMBEDDING_NUM_PARALLEL:-2}
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_MAX_QUEUE=${OLLAMA_EMBEDDING_MAX_QUEUE:-64}
      - OLLAMA_CONTEXT_LENGTH=2048
      - OLLAMA_KEEP_ALIVE=${OLLAMA_EMBEDDING_KEEP_ALIVE:-24h}
    cpus: ${OLLAMA_EMBEDDING_CPUS:-2.0}
    mem_limit: ${OLLAMA_EMBEDDING_MEMORY_LIMIT:-3g}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - machining-network

  ollama-chat-init:
    image: ollama/ollama:latest
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama-chat:11434
    entrypoint: ["ollama"]
    command: ["pull", "${MODEL_NAME:-qwen2.5:3b}"]
    depends_on:
      ollama-chat:
        condition: service_healthy
    networks:
      - machining-network

  ollama-embeddings-init:
    image: ollama/ollama:latest
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama-embeddings:11434
    entrypoint: ["ollama"]
    command: ["pull", "${EMBEDDING_MODEL_NAME:-nomic-embed-text}"]
    depends_on:
      ollama-embeddings:
        condition: service_healthy
    networks:
      - machining-network

  # 2. Base de Datos Vectorial (Para RAG)
  vector-db:
    image: qdrant/qdrant:latest # Opción robusta y ligera (o chromadb / pgvector)
    container_name: machining_vector_db
    hostname: vector-db
    restart: always
    ports:
      - 6333:6333
    volumes:
      - ./qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      # En producción Qdrant puede tardar varios minutos en recuperar WAL,
      # colecciones e índices existentes. Durante este período Compose no debe
      # bloquear todos los servicios dependientes marcándolo como unhealthy.
      retries: 60
      start_period: 120s
    networks:
      - machining-network

  # 3. Base de Datos de Producción y Sensores (TimescaleDB / PostgreSQL)
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: machining_db
    hostname: timescaledb
    restart: always
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=machining_db
    ports:
      - 5432:5432
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d machining_db"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - machining-network

  # 4. Cache y Gestión de Estado/Colas
  redis-cache:
    image: redis:alpine
    container_name: machining_redis
    hostname: redis-cache
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - machining-network

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    hostname: n8n
    restart: always
    ports:
      - 5678:5678
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Europe/Lisbon}
      - TZ=${TZ:-Europe/Lisbon}
      - N8N_SECURE_COOKIE=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-admin123}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=timescaledb
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=user
      - DB_POSTGRESDB_PASSWORD=pass
      - AGENT_API_URL=http://agent-service:8000
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./n8n_data:/home/node/.n8n
    depends_on:
      agent-service:
        condition: service_started
      timescaledb:
        condition: service_healthy
    networks:
      - machining-network

networks:
  machining-network:
    driver: bridge

volumes:
  redis_data:
