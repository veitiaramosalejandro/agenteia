# Produccion para Ryzen 9 3950X / 128 GiB. SERVER_DATA_ROOT debe apuntar al
# almacenamiento persistente montado; por defecto se usan rutas del proyecto.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
    max-file: ${DOCKER_LOG_MAX_FILES:-5}

services:
  # API del agente. n8n accede internamente mediante http://agent-service:8000.
  nginx:
    image: nginx:1.27-alpine
    container_name: machining_nginx
    hostname: nginx
    restart: always
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/conf.d/agent.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/internal:/etc/nginx/internal:ro
    depends_on:
      agent-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - machining-network
    logging: *default-logging

  certbot:
    image: certbot/certbot:latest
    container_name: machining_certbot
    profiles: ["certbot"]
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

  agent-service:
    image: agent-beta:0.0.1    
    build:
      context: ./agent-service
      dockerfile: Dockerfile
    container_name: machining_agent
    hostname: agent-service
    restart: always
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    expose:
      - "8000"
    env_file:
      - ${AGENT_ENV_FILE:-.env}
    environment:
      ENVIRONMENT: production
      RUNNING_IN_DOCKER: "1"
      OLLAMA_BASE_URL: http://ollama-chat:11434
      EMBEDDING_BASE_URL: http://ollama-embeddings:11434
      VECTOR_DB_URL: http://vector-db:6333
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      MODEL_NAME: ${MODEL_NAME:-qwen2.5:3b}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-4096}
      POSTGRES_USER: ${POSTGRES_USER:-robotea}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD debe estar definida}
      POSTGRES_DB: ${POSTGRES_DB:-machining_db}
      DB_URL: ${DB_URL:?DB_URL debe estar definida}
      REDIS_URL: redis://redis-cache:6379
      # La API admite dos solicitudes; Ollama serializa la inferencia del 7B
      # para que una segunda KV cache no agote los 8 GiB de la Quadro M4000.
      DIALOGUE_MAX_CONCURRENT: ${DIALOGUE_MAX_CONCURRENT:-2}
      LLM_COMPACT_RUNTIME_PROMPT: ${LLM_COMPACT_RUNTIME_PROMPT:-true}
      LLM_DIALOGUE_MAX_OUTPUT_TOKENS: ${LLM_DIALOGUE_MAX_OUTPUT_TOKENS:-640}
      LLM_SUGGESTION_MAX_OUTPUT_TOKENS: ${LLM_SUGGESTION_MAX_OUTPUT_TOKENS:-384}
      INTERACTIVE_PRIORITY_ENABLED: ${INTERACTIVE_PRIORITY_ENABLED:-true}
      INGESTION_PAUSE_DURING_INTERACTIVE: ${INGESTION_PAUSE_DURING_INTERACTIVE:-true}
      # SQL_SERVER_HOST/INSTANCE/PORT proceden de .env.production. No deben
      # interpolarse aquí desde el .env de desarrollo.
      # Las respuestas usan la identidad por recurso almacenada en PostgreSQL.
      # Se neutraliza cualquier cuenta global antigua que permanezca en .env.
      SOLIDSET_LOGIN_USERNAME: ""
      SOLIDSET_LOGIN_PASSWORD: ""
      SOLIDSET_LOGIN_HASHPASS: ""
      SOLIDSET_LOGIN_RESOURCE_ID: ""
      SOLIDSET_RESOURCE_ID: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:      
      - ${SERVER_DATA_ROOT:-.}/data:/app/data
      - ${SERVER_DATA_ROOT:-.}/audio:/app/audio
    depends_on:
      ollama-chat-init:
        condition: service_completed_successfully
      ollama-embeddings-init:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      vector-db:
        condition: service_healthy
    cpus: ${AGENT_SERVICE_CPUS:-4.0}
    mem_limit: ${AGENT_SERVICE_MEMORY_LIMIT:-8g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/agent/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - machining-network      
    logging: *default-logging

  # Worker durable. Escala horizontalmente sin cambiar la API:
  # docker compose -f docker-compose-prod.yml up -d --scale agent-worker=4
  agent-worker:
    image: agent-beta:0.0.1
    restart: always
    command: ["python", "-m", "app.response_worker"]
    env_file:
      - ${AGENT_ENV_FILE:-.env}
    environment:
      ENVIRONMENT: production
      RUNNING_IN_DOCKER: "1"
      OLLAMA_BASE_URL: http://ollama-chat:11434
      EMBEDDING_BASE_URL: http://ollama-embeddings:11434
      VECTOR_DB_URL: http://vector-db:6333
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-robotea}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD debe estar definida}
      POSTGRES_DB: ${POSTGRES_DB:-machining_db}
      REDIS_URL: redis://redis-cache:6379
      SOLIDSET_LOGIN_USERNAME: ""
      SOLIDSET_LOGIN_PASSWORD: ""
      SOLIDSET_LOGIN_HASHPASS: ""
      SOLIDSET_LOGIN_RESOURCE_ID: ""
      SOLIDSET_RESOURCE_ID: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${SERVER_DATA_ROOT:-.}/data:/app/data
      - ${SERVER_DATA_ROOT:-.}/audio:/app/audio
    depends_on:
      ollama-chat-init:
        condition: service_completed_successfully
      ollama-embeddings-init:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      vector-db:
        condition: service_healthy
    cpus: ${AGENT_WORKER_CPUS:-8.0}
    mem_limit: ${AGENT_WORKER_MEMORY_LIMIT:-12g}
    networks:
      - machining-network
    logging: *default-logging

  solidset-retry-worker:
    image: agent-beta:0.0.1
    container_name: machining_solidset_retry_worker
    hostname: solidset-retry-worker
    restart: always
    command: ["python", "-m", "app.solidset_retry_worker"]
    env_file:
      - ${AGENT_ENV_FILE:-.env}
    environment:
      ENVIRONMENT: production
      RUNNING_IN_DOCKER: "1"
      REDIS_URL: redis://redis-cache:6379
      POSTGRES_HOST: timescaledb
      SOLIDSET_LOGIN_USERNAME: ""
      SOLIDSET_LOGIN_PASSWORD: ""
      SOLIDSET_LOGIN_HASHPASS: ""
      SOLIDSET_LOGIN_RESOURCE_ID: ""
      SOLIDSET_RESOURCE_ID: ""
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["${SERVER_DATA_ROOT:-.}/data:/app/data"]
    depends_on:
      timescaledb: {condition: service_healthy}
      redis-cache: {condition: service_healthy}
    networks: [machining-network]
    logging: *default-logging

  historical-worker:
    image: agent-beta:0.0.1
    restart: always
    command: ["python", "-m", "app.historical.worker"]
    env_file:
      - ${AGENT_ENV_FILE:-.env}
    environment:
      ENVIRONMENT: production
      RUNNING_IN_DOCKER: "1"
      OLLAMA_BASE_URL: http://ollama-chat:11434
      EMBEDDING_BASE_URL: http://ollama-embeddings:11434
      VECTOR_DB_URL: http://vector-db:6333
      POSTGRES_HOST: timescaledb
      REDIS_URL: redis://redis-cache:6379
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["${SERVER_DATA_ROOT:-.}/data:/app/data"]
    depends_on:
      ollama-embeddings-init: {condition: service_completed_successfully}
      timescaledb: {condition: service_healthy}
      redis-cache: {condition: service_healthy}
      vector-db: {condition: service_healthy}
    cpus: ${HISTORICAL_WORKER_CPUS:-6.0}
    mem_limit: ${HISTORICAL_WORKER_MEMORY_LIMIT:-8g}
    networks: [machining-network]
    logging: *default-logging

  historical-producer:
    extends:
      service: historical-worker
    command: ["python", "-m", "app.historical.producer"]

  system-knowledge-worker:
    image: agent-beta:0.0.1
    container_name: system-knowledge-worker
    hostname: system-knowledge-worker
    restart: always
    command: ["python", "-m", "app.system.system_knowledge_worker"]
    env_file:
      - ${AGENT_ENV_FILE:-.env}
    environment:
      ENVIRONMENT: production
      RUNNING_IN_DOCKER: "1"
      SYSTEM_KNOWLEDGE_EMBEDDING_BASE_URL: http://ollama-system-embeddings:11434
      VECTOR_DB_URL: http://vector-db:6333
      POSTGRES_HOST: timescaledb
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["${SERVER_DATA_ROOT:-.}/data:/app/data"]
    depends_on:
      ollama-system-embeddings-init: {condition: service_completed_successfully}
      timescaledb: {condition: service_healthy}
      vector-db: {condition: service_healthy}
    cpus: ${SYSTEM_KNOWLEDGE_WORKER_CPUS:-6.0}
    mem_limit: ${SYSTEM_KNOWLEDGE_WORKER_MEMORY_LIMIT:-8g}
    networks: [machining-network]
    logging: *default-logging

  # Runtime interactivo. El overlay GPU reserva la GPU únicamente para este
  # servicio; embeddings e ingestión usan el runtime CPU independiente.
  ollama-chat:
    # 0.33.2 fue validada en este servidor con CUDA 12 y compute capability 5.2.
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.33.2}
    container_name: machining_ollama_chat
    hostname: ollama-chat
    restart: always
    user: root
    expose:
      - "11434"
    volumes:
      # Este volumen guarda los modelos descargados localmente:
      - ${SERVER_DATA_ROOT:-.}/ollama_storage:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      # El compose base funciona también sin GPU. Con CPU se limita la
      # concurrencia para no agotar RAM; el overlay GPU puede sobrescribirla.
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_MAX_QUEUE=${OLLAMA_MAX_QUEUE:-32}
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-4096}
      # Maxwell no dispone de los tensor cores usados por Flash Attention.
      - OLLAMA_FLASH_ATTENTION=0
      - OLLAMA_KV_CACHE_TYPE=f16
      - OLLAMA_SCHED_SPREAD=false
      - OLLAMA_LOAD_TIMEOUT=${OLLAMA_LOAD_TIMEOUT:-10m}
      - LLAMA_ARG_FIT_TARGET=512
      - OLLAMA_KEEP_ALIVE=${OLLAMA_CHAT_KEEP_ALIVE:-24h}
    cpus: ${OLLAMA_CHAT_CPUS:-24.0}
    mem_limit: ${OLLAMA_CHAT_MEMORY_LIMIT:-32g}
    shm_size: ${OLLAMA_CHAT_SHM_SIZE:-2g}
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      machining-network:
        aliases:
          - ollama-llm
    logging: *default-logging

  ollama-embeddings:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.33.2}
    container_name: machining_ollama_embeddings
    hostname: ollama-embeddings
    restart: always
    user: root
    expose:
      - "11434"
    volumes:
      - ${SERVER_DATA_ROOT:-.}/ollama_embedding_storage:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_NUM_PARALLEL=${OLLAMA_EMBEDDING_NUM_PARALLEL:-2}
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_MAX_QUEUE=${OLLAMA_EMBEDDING_MAX_QUEUE:-64}
      - OLLAMA_CONTEXT_LENGTH=2048
      - OLLAMA_KEEP_ALIVE=${OLLAMA_EMBEDDING_KEEP_ALIVE:-24h}
    cpus: ${OLLAMA_EMBEDDING_CPUS:-4.0}
    mem_limit: ${OLLAMA_EMBEDDING_MEMORY_LIMIT:-6g}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - machining-network
    logging: *default-logging

  ollama-system-embeddings:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.33.2}
    container_name: machining_ollama_system_embeddings
    hostname: ollama-system-embeddings
    restart: always
    user: root
    expose:
      - "11434"
    volumes:
      - ${SERVER_DATA_ROOT:-.}/ollama_system_embedding_storage:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_NUM_PARALLEL=${OLLAMA_SYSTEM_EMBEDDING_NUM_PARALLEL:-2}
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_MAX_QUEUE=${OLLAMA_SYSTEM_EMBEDDING_MAX_QUEUE:-128}
      - OLLAMA_CONTEXT_LENGTH=2048
      - OLLAMA_KEEP_ALIVE=${OLLAMA_SYSTEM_EMBEDDING_KEEP_ALIVE:-24h}
    cpus: ${OLLAMA_SYSTEM_EMBEDDING_CPUS:-4.0}
    mem_limit: ${OLLAMA_SYSTEM_EMBEDDING_MEMORY_LIMIT:-6g}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - machining-network
    logging: *default-logging

  ollama-chat-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.33.2}
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama-chat:11434
    entrypoint: ["ollama"]
    command: ["pull", "${MODEL_NAME:-qwen2.5:3b}"]
    depends_on:
      ollama-chat:
        condition: service_healthy
    networks:
      - machining-network

  ollama-embeddings-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.33.2}
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama-embeddings:11434
    entrypoint: ["ollama"]
    command: ["pull", "${EMBEDDING_MODEL_NAME:-nomic-embed-text}"]
    depends_on:
      ollama-embeddings:
        condition: service_healthy
    networks:
      - machining-network

  ollama-system-embeddings-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.33.2}
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama-system-embeddings:11434
    entrypoint: ["ollama"]
    command: ["pull", "${EMBEDDING_MODEL_NAME:-nomic-embed-text}"]
    depends_on:
      ollama-system-embeddings:
        condition: service_healthy
    networks:
      - machining-network

  # 2. Base de Datos Vectorial (Para RAG)
  vector-db:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:latest}
    container_name: machining_vector_db
    hostname: vector-db
    restart: always
    expose:
      - "6333"
    volumes:
      - ${SERVER_DATA_ROOT:-.}/qdrant_data:/qdrant/storage
    mem_limit: ${QDRANT_MEMORY_LIMIT:-16g}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      # En producción Qdrant puede tardar varios minutos en recuperar WAL,
      # colecciones e índices existentes. Durante este período Compose no debe
      # bloquear todos los servicios dependientes marcándolo como unhealthy.
      retries: 60
      start_period: 120s
    networks:
      - machining-network
    logging: *default-logging

  # 3. Base de Datos de Producción y Sensores (TimescaleDB / PostgreSQL)
  timescaledb:
    image: ${TIMESCALEDB_IMAGE:-timescale/timescaledb:latest-pg15}
    container_name: machining_db
    hostname: timescaledb
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-robotea}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD debe estar definida}
      POSTGRES_DB: ${POSTGRES_DB:-machining_db}
    expose:
      - "5432"
    volumes:
      - ${SERVER_DATA_ROOT:-.}/postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-16g}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - machining-network
    logging: *default-logging

  # 4. Cache y Gestión de Estado/Colas
  redis-cache:
    image: redis:alpine
    container_name: machining_redis
    hostname: redis-cache
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    expose:
      - "6379"
    volumes:
      - ${SERVER_DATA_ROOT:-.}/redis_data:/data
    mem_limit: ${REDIS_MEMORY_LIMIT:-4g}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - machining-network
    logging: *default-logging

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    hostname: n8n
    restart: always
    ports:
      - "${N8N_BIND_ADDRESS:-127.0.0.1}:5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Europe/Lisbon}
      - TZ=${TZ:-Europe/Lisbon}
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE:-true}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:?N8N_BASIC_AUTH_USER debe estar definido}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:?N8N_BASIC_AUTH_PASSWORD debe estar definido}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=timescaledb
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_POSTGRES_DB:-machining_db}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-robotea}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD debe estar definida}
      - AGENT_API_URL=http://agent-service:8000
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ${SERVER_DATA_ROOT:-.}/n8n_data:/home/node/.n8n
    depends_on:
      agent-service:
        condition: service_started
      timescaledb:
        condition: service_healthy
    networks:
      - machining-network
    logging: *default-logging

networks:
  machining-network:
    driver: bridge
