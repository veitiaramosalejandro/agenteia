name: solidset-data-api

services:
  data-api:
    image: solidset-data-api:${SOLIDSET_DATA_API_VERSION:-0.1.0}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solidset_data_api
    hostname: solidset-data-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Dentro de Docker, localhost identifica al contenedor. Para SQL Server
      # instalado en el host se utiliza host.docker.internal.
      SQL_SERVER_HOST: ${SQL_SERVER_HOST:-host.docker.internal}
    ports:
      - "${SOLIDSET_DATA_API_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - solidset-data-network

networks:
  solidset-data-network:
    name: solidset-data-network
    driver: bridge
