map $http_x_solidset_instance $solidset_rate_key {
    default $http_x_solidset_instance;
    "" $binary_remote_addr;
}
limit_req_zone $binary_remote_addr zone=agent_per_ip:10m rate=100r/s;
limit_req_zone $solidset_rate_key zone=agent_per_instance:10m rate=200r/s;

upstream solidset_agent_api {
    server agent-service:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name android.isicom.pt;

    client_max_body_size 50m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        limit_req zone=agent_per_ip burst=200 nodelay;
        limit_req zone=agent_per_instance burst=500 nodelay;
        limit_req_status 429;
        proxy_pass http://solidset_agent_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 15s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
