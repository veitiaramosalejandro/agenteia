services:
  # 3. Servidor de Modelos Locales (Ollama)
  ollama-llm:
    image: ollama/ollama:latest
    container_name: machining_ollama
    restart: always
    user: root  # Añadir esta línea
    ports:
      - 11434:11434
    volumes:
      # Este volumen guarda los modelos descargados localmente:
      - ./ollama_storage:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=30m
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 15s
    # Si cuentas con GPU Nvidia, descomenta estas líneas para aceleración hardware:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - machining-network

  # 2. Base de Datos Vectorial (Para RAG)
  vector-db:
    image: qdrant/qdrant:latest # Opción robusta y ligera (o chromadb / pgvector)
    container_name: machining_vector_db
    restart: always
    ports:
      - 6333:6333
    volumes:
      - ./qdrant_data:/qdrant/storage
    networks:
      - machining-network

  # 3. Base de Datos de Producción y Sensores (TimescaleDB / PostgreSQL)
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: machining_db
    restart: always
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=machining_db
    ports:
      - 5432:5432
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - machining-network

  # 4. Cache y Gestión de Estado/Colas
  redis-cache:
    image: redis:alpine
    container_name: machining_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - machining-network

networks:
  machining-network:
    driver: bridge
  network-db01:
    name: network-db01    
    external: true

volumes:
  redis_data:
