services:
  # 3. Servidor de Modelos Locales (Ollama)
  ollama-llm:
    image: ollama/ollama:latest
    container_name: machining_ollama
    hostname: ollama-llm
    restart: always
    user: root  # Añadir esta línea
    ports:
      - 11434:11434
    volumes:
      # Este volumen guarda los modelos descargados localmente:
      - ./ollama_storage:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      # Ajustado para una RTX A3000 de 6 GB: chat y embeddings grandes se cargan
      # de uno en uno para evitar agotar VRAM/RAM.
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-2}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-2}
      - OLLAMA_MAX_QUEUE=${OLLAMA_MAX_QUEUE:-32}
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-4096}
      - OLLAMA_FLASH_ATTENTION=${OLLAMA_FLASH_ATTENTION:-1}
      - OLLAMA_KV_CACHE_TYPE=${OLLAMA_KV_CACHE_TYPE:-q8_0}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 15s
    # Si cuentas con GPU Nvidia, descomenta estas líneas para aceleración hardware:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - machining-network

  # 2. Base de Datos Vectorial (Para RAG)
  vector-db:
    image: qdrant/qdrant:latest # Opción robusta y ligera (o chromadb / pgvector)
    container_name: machining_vector_db
    hostname: vector-db
    restart: always
    ports:
      - 6333:6333
    volumes:
      - ./qdrant_data:/qdrant/storage
    networks:
      - machining-network

  # 3. Base de Datos de Producción y Sensores (TimescaleDB / PostgreSQL)
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: machining_db
    hostname: timescaledb
    restart: always
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=machining_db
    ports:
      - 5432:5432
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - machining-network

  # 4. Cache y Gestión de Estado/Colas
  redis-cache:
    image: redis:alpine
    container_name: machining_redis
    hostname: redis-cache
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - machining-network

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    hostname: n8n
    restart: always
    ports:
      - 5678:5678
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
      - N8N_SECURE_COOKIE=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin123
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=timescaledb
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=user
      - DB_POSTGRESDB_PASSWORD=pass
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./n8n_data:/home/node/.n8n
    networks:
      - machining-network

networks:
  machining-network:
    driver: bridge
  network-db01:
    name: network-db01    
    external: true

volumes:
  redis_data:
