services:
  nginx:
    image: nginx:1.27-alpine
    container_name: machining_nginx
    hostname: nginx
    restart: unless-stopped
    ports:
      - 80:80
    volumes:
      - ./nginx/conf.d/agent.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      agent-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - machining-network

  # API del agente. n8n accede internamente mediante http://agent-service:8000.
  agent-service:
    image: agent-service:0.0.1
    build:
      context: ./agent-service
      dockerfile: Dockerfile
    container_name: machining_agent
    hostname: agent-service
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - 8000:8000
    env_file:
      - .env
    environment:
      ENVIRONMENT: development
      RUNNING_IN_DOCKER: "1"
      OLLAMA_BASE_URL: http://ollama-llm:11434
      VECTOR_DB_URL: http://vector-db:6333
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      DB_URL: postgresql://user:pass@timescaledb:5432/machining_db
      REDIS_URL: redis://redis-cache:6379
      # El SQL Server de desarrollo se ejecuta en el host. En un servidor
      # remoto puede sobrescribirse con SQL_SERVER_HOST desde Compose/.env.
      SQL_SERVER_HOST: ${SQL_SERVER_DOCKER_HOST:-host.docker.internal}
      # URLs de diagnóstico/listener. El enrutamiento de respuestas continúa
      # resolviéndose mediante SysSolidSETInstance en PostgreSQL.
      SOLIDSET_RESTAPI_BASE_URL: ${SOLIDSET_DOCKER_BASE_URL:-http://host.docker.internal:52130}
      SOLIDSET_CHAT_BASE_URL: ${SOLIDSET_DOCKER_BASE_URL:-http://host.docker.internal:52130}
      NOTIF_API_BASE_URL: ${NOTIF_DOCKER_BASE_URL:-http://host.docker.internal:52131}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./agent-service:/app
      - ./data:/app/data
      - ./audio:/app/audio
    depends_on:
      ollama-llm:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      vector-db:
        condition: service_started
    networks:
      - machining-network
      - network-db01

  # 3. Servidor de Modelos Locales (Ollama)
  ollama-llm:
    image: ollama/ollama:latest
    container_name: machining_ollama
    hostname: ollama-llm
    restart: always
    user: root  # Añadir esta línea
    ports:
      - 11434:11434
    volumes:
      # Este volumen guarda los modelos descargados localmente:
      - ./ollama_storage:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      # Ajustado para una RTX A3000 de 6 GB: chat y embeddings grandes se cargan
      # de uno en uno para evitar agotar VRAM/RAM.
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-2}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-2}
      - OLLAMA_MAX_QUEUE=${OLLAMA_MAX_QUEUE:-32}
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-4096}
      - OLLAMA_FLASH_ATTENTION=${OLLAMA_FLASH_ATTENTION:-1}
      - OLLAMA_KV_CACHE_TYPE=${OLLAMA_KV_CACHE_TYPE:-q8_0}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 15s
    # Si cuentas con GPU Nvidia, descomenta estas líneas para aceleración hardware:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - machining-network

  # 2. Base de Datos Vectorial (Para RAG)
  vector-db:
    image: qdrant/qdrant:latest # Opción robusta y ligera (o chromadb / pgvector)
    container_name: machining_vector_db
    hostname: vector-db
    restart: always
    ports:
      - 6333:6333
    volumes:
      - ./qdrant_data:/qdrant/storage
    networks:
      - machining-network

  # 3. Base de Datos de Producción y Sensores (TimescaleDB / PostgreSQL)
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: machining_db
    hostname: timescaledb
    restart: always
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=machining_db
    ports:
      - 5432:5432
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d machining_db"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - machining-network

  # 4. Cache y Gestión de Estado/Colas
  redis-cache:
    image: redis:alpine
    container_name: machining_redis
    hostname: redis-cache
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - machining-network

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    hostname: n8n
    restart: always
    ports:
      - 5678:5678
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Europe/Lisbon}
      - TZ=${TZ:-Europe/Lisbon}
      - N8N_SECURE_COOKIE=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-admin123}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=timescaledb
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=user
      - DB_POSTGRESDB_PASSWORD=pass
      - AGENT_API_URL=http://agent-service:8000
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./n8n_data:/home/node/.n8n
    depends_on:
      agent-service:
        condition: service_started
      timescaledb:
        condition: service_healthy
    networks:
      - machining-network

networks:
  machining-network:
    driver: bridge
  network-db01:
    name: network-db01    
    external: true

volumes:
  redis_data:
