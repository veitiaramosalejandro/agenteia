services:
  ollama-chat:
    environment:
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

# En hosts con una sola GPU, el overlay la reserva únicamente para chat.
# Los embeddings permanecen en CPU para proteger la latencia interactiva.
