services:
  ollama-chat:
    environment:
      # Dos slots dieron la mejor latencia/throughput en la Quadro M4000:
      # cuatro caben en VRAM, pero aumentaron la latencia individual 55–91 %.
      - OLLAMA_NUM_PARALLEL=${OLLAMA_CHAT_NUM_PARALLEL:-2}
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_GPU_OVERHEAD=${OLLAMA_GPU_OVERHEAD:-536870912}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

# En hosts con una sola GPU, el overlay la reserva únicamente para chat.
# Los embeddings permanecen en CPU para proteger la latencia interactiva.
