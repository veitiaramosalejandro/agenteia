services:
  ollama-chat:
    environment:
      # El modelo actual ocupa aproximadamente 19 GB. Un solo slot evita
      # duplicar la KV cache y es más estable con agentes concurrentes en cola.
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_GPU_OVERHEAD=${OLLAMA_GPU_OVERHEAD:-536870912}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

# En hosts con una sola GPU, el overlay la reserva únicamente para chat.
# Los embeddings permanecen en CPU para proteger la latencia interactiva.
