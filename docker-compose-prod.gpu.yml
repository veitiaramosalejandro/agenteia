services:
  ollama-chat:
    environment:
      # qwen2.5:7b + contexto 4096 cabe en los 8 GiB de la M4000, pero dos
      # inferencias paralelas reducen demasiado el margen de VRAM.
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_GPU_OVERHEAD=${OLLAMA_GPU_OVERHEAD:-536870912}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

# En hosts con una sola GPU, el overlay la reserva únicamente para chat.
# Los embeddings permanecen en CPU para proteger la latencia interactiva.
